# Refresh the market data on a schedule, commit it, and publish the site to GitHub Pages.
# One workflow does both because commits made with GITHUB_TOKEN do not trigger other workflows.
name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * 1-5"   # 16:30 EAT, after the DSE closes
    - cron: "0 6 * * 1-6"     # 09:00 EAT, after UTT AMIS publishes the previous day's NAVs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        # exits 1 if any source failed; the data files are still complete (failed sources keep their last good copy)
        run: python -m pipeline || echo "::warning::Some sources failed, see data/meta.json"
      - name: Commit changed data
        run: |
          git config user.name "mtaji-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # pick up the data commit made by the refresh job
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: mkdir _site && cp -r index.html assets data _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4

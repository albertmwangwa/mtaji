# Refresh the market data on a schedule, commit it, and publish the site to GitHub Pages.
# One workflow does both because commits made with GITHUB_TOKEN do not trigger other workflows.
name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub may delay or skip runs at busy times (on the hour), so these use odd minutes; times are UTC (EAT = UTC+3)
    - cron: "17 6 * * 1-6"    # 09:17 EAT: UTT AMIS has published the previous day's NAVs
    - cron: "47 13 * * 1-5"   # 16:47 EAT: after the DSE closes and BoT posts the day's rates
    - cron: "23 18 * * 3"     # 21:23 EAT Wednesday: T-bill and bond auction results are out
    - cron: "*/20 6-13 * * 1-5"   # every 20 min, 09:00-16:40 EAT on weekdays: DSE session so far (live job only)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        # the 20-minute schedule only reads the DSE market watch; everything else runs the full pipeline.
        # exits 1 if any source failed; the data files are still complete (failed sources keep their last good copy)
        run: |
          if [ "${{ github.event.schedule }}" = "*/20 6-13 * * 1-5" ]; then
            python -m pipeline live || echo "::warning::DSE market watch could not be read"
          else
            python -m pipeline || echo "::warning::Some sources failed, see data/meta.json"
          fi
      - name: Commit changed data
        run: |
          git config user.name "mtaji-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "data: ${{ github.event.schedule == '*/20 6-13 * * 1-5' && 'live' || 'refresh' }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # pick up the data commit made by the refresh job
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/legacy
          cp -r index.html assets data _site/
          cp "legacy/Mtaji Investment Calculators.html" _site/legacy/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
